<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151923">
<title>MHO ARMOR PLANNER</title>
<style>
:root{color-scheme:dark;--bg:#10141d;--panel:#1a2130;--line:#30394a;--text:#f4f6fb;--muted:#aab3c2;--accent:#77b7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
main{max-width:760px;margin:auto;padding:24px 16px 48px}.brand{font-size:12px;letter-spacing:.18em;color:var(--accent);font-weight:700}.title{font-size:25px;margin:8px 0 6px}.sub{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 22px}
.notice{border:1px solid #8b7137;background:#302817;color:#f4d99a;padding:13px 14px;border-radius:12px;font-size:13px;line-height:1.65;margin-bottom:20px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.tab{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:13px 8px;border-radius:10px;font-size:14px}.tab.active{border-color:var(--accent);color:var(--accent)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}.card h2{font-size:16px;margin:0 0 14px}.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.slot{padding:10px 3px;border-radius:9px;background:#252e3e;text-align:center;font-size:13px;color:var(--muted)}.slot.selected{background:#244365;color:#fff;border:1px solid var(--accent)}
label{display:block;color:var(--muted);font-size:12px;margin:12px 0 6px}select,input{width:100%;background:#111722;border:1px solid var(--line);color:var(--text);border-radius:9px;padding:12px;font-size:15px}button.primary{width:100%;border:0;background:#367fc4;color:white;border-radius:10px;padding:14px;font-size:15px;font-weight:700;margin-top:14px}button:disabled{opacity:.55}
.result{color:var(--muted);font-size:13px;line-height:1.7}.foot{color:#7f8999;font-size:11px;text-align:center;margin-top:26px}
</style>
</head>
<body><main>
<div class="brand">MONSTER HUNTER OUTLANDERS</div>
<h1 class="title">MHO ARMOR PLANNER</h1>
<p class="sub">防具の強化素材をまとめて確認するためのツール</p>
<div class="notice"><strong>開発中の試作品です</strong><br>現在は画面の確認用です。ゲーム内の防具・素材データおよび必要素材の計算機能は、まだ登録されていません。</div>
<div class="tabs"><button class="tab active" id="pieceTab" type="button">部位ごとに選ぶ</button><button class="tab" id="setTab" type="button">防具セットから選ぶ</button></div>
<section class="card"><h2 id="modeTitle">防具を部位ごとに選択</h2><div class="slots" id="slots"><div class="slot selected">頭</div><div class="slot">胴</div><div class="slot">腕</div><div class="slot">腰</div><div class="slot">脚</div></div>
<label for="armor">防具</label><select id="armor"><option>防具データ準備中</option></select>
<label for="current">現在のレアリティ</label><select id="current"></select>
<label for="target">目標のレアリティ</label><select id="target"></select>
<button class="primary" type="button" disabled>素材を集計（データ準備中）</button>
</section>
<section class="card"><h2>必要素材の集計結果</h2><p class="result">防具データが登録されると、選択した防具の強化に必要な素材を集計し、複数部位で共通する素材も合算して表示します。</p></section>
<p class="foot">MHO ARMOR PLANNER · Prototype</p>
</main>
<script>
const current=document.getElementById('current'),target=document.getElementById('target');
for(let i=1;i<=15;i++){for(const s of [current,target]){const o=document.createElement('option');o.value=i;o.textContent='R'+i;s.appendChild(o)}}
current.value='1';target.value='15';
const pieceTab=document.getElementById('pieceTab'),setTab=document.getElementById('setTab');
pieceTab.addEventListener('click',()=>{pieceTab.classList.add('active');setTab.classList.remove('active');document.getElementById('modeTitle').textContent='防具を部位ごとに選択';document.getElementById('slots').style.display='grid';document.getElementById('armor').innerHTML='<option>防具データ準備中</option>'});
setTab.addEventListener('click',()=>{setTab.classList.add('active');pieceTab.classList.remove('active');document.getElementById('modeTitle').textContent='防具セットを選択';document.getElementById('slots').style.display='none';document.getElementById('armor').innerHTML='<option>シリーズデータ準備中</option>'});
document.querySelectorAll('.slot').forEach(el=>el.addEventListener('click',()=>{document.querySelectorAll('.slot').forEach(x=>x.classList.remove('selected'));el.classList.add('selected')}));
</script></body></html>
